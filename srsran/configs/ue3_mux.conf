# srsUE 3 — 5G SA over ZMQ, Paper 1108 rebuild
# netns ue3 is THE fix for the UERANSIM downlink failure: the UE address is
# no longer local to the host namespace, so downlink genuinely traverses the RAN.
[rf]
freq_offset = 0
tx_gain = 80
rx_gain = 40
srate = 23.04e6
device_name = zmq
device_args = tx_port=tcp://*:2301,rx_port=tcp://localhost:2300,id=ue3,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none

[log]
all_level = warning
filename = /tmp/srsran/ue3.log
all_hex_limit = 0
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = E8ED289DEBA952E4283B54E88E6183CA
k    = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000003
imei = 353490069873339

[rrc]
release           = 15
ue_category       = 4

[nas]
apn               = internet
apn_protocol      = ipv4

[gw]
netns             = ue3

[gui]
enable = false
